<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桜の園 | 2026年度ロシア語劇 パンフレット</title>
<meta name="description" content="2026年度ロシア語劇「桜の園（Вишнёвый сад）」のパンフレット。ページ上で閲覧・ダウンロードできます。">
<meta property="og:type" content="website">
<meta property="og:title" content="桜の園 | 2026年度ロシア語劇 パンフレット">
<meta property="og:description" content="原作 アントン・チェーホフ。パンフレットをページ上で閲覧・ダウンロードできます。">
<meta property="og:url" content="https://kanatty0626.github.io/tufsrussia/">
<meta property="og:image" content="https://kanatty0626.github.io/tufsrussia/assets/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&family=Noto+Sans+JP:wght@400;600&display=swap">
<style>
  :root{
    --bg:#e9eaec; --surface:#f7f7f8; --fg:#1c1d20; --sub:#5c5f66; --line:#d3d5da;
    --accent:#a3304f; --on-accent:#fff; --shadow:rgba(20,22,28,.18);
    --display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
    --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#121316; --surface:#1c1d21; --fg:#eceef2; --sub:#a2a6ae; --line:#2c2e34;
    --accent:#e2789a; --on-accent:#1a0d12; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.7}
  .gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .bar{max-width:880px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .titles{flex:1;min-width:0}
  .eyebrow{margin:0;font-size:.72rem;letter-spacing:.12em;color:var(--sub)}
  h1{margin:0;font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.35}
  h1 span{font-size:.8em;color:var(--sub);margin-left:.4em}
  .savebtn{display:inline-flex;align-items:center;padding:8px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none}
  .savebtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  main{max-width:880px;margin:0 auto;padding-block:16px 40px}
  #msg{margin:0 0 16px;font-size:.85rem;color:var(--sub);min-height:1.5em}
  #viewer{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #pages{display:grid;gap:20px;width:100%;margin:0 auto;padding-bottom:72px}
  #pages canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 14px var(--shadow);border-radius:3px}
  .loading{padding:64px 0;text-align:center;color:var(--sub)}
  #fallback{width:100%;height:85vh;border:0}
  .zoom{position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 18px var(--shadow)}
  .zoom button{display:grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border:0;border-radius:999px;background:transparent;color:var(--fg);font:inherit;font-size:.85rem;font-variant-numeric:tabular-nums;cursor:pointer}
  .zoom button:hover{background:var(--bg)}
  .zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .zoom button:disabled{opacity:.35;cursor:default}
  .zoom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
</style>
</head>
<body>
<header class="gutter">
  <div class="bar">
    <div class="titles">
      <p class="eyebrow">2026年度 ロシア語劇</p>
      <h1>桜の園<span>Вишнёвый сад</span></h1>
    </div>
    <a id="dl" class="savebtn" href="files/2026_russian-play_pamphlet.pdf" download="2026_russian-play_pamphlet.pdf">パンフレットを保存</a>
  </div>
</header>

<main class="gutter">
  <p id="msg" role="status">パンフレットのダウンロードを開始しました。始まらない場合は右上の「パンフレットを保存」を押してください。</p>
  <div id="viewer"><div id="pages"><div class="loading">読み込み中…</div></div></div>
  <iframe id="fallback" title="パンフレット" hidden></iframe>
</main>

<div class="zoom" id="zoom" role="toolbar" aria-label="拡大・縮小" hidden>
  <button type="button" id="zout" aria-label="縮小" title="縮小">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>
  </button>
  <button type="button" id="zreset" aria-label="100%に戻す" title="100%に戻す">100%</button>
  <button type="button" id="zin" aria-label="拡大" title="拡大">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"/></svg>
  </button>
</div>

<script src="assets/pdfjs/pdf.min.js"></script>
<script>
(() => {
  const PDF = "files/2026_russian-play_pamphlet.pdf";

  // 開いたら自動でダウンロード
  window.addEventListener("load", () => { try { document.getElementById("dl").click(); } catch (e) {} });

  // ページ上で閲覧（拡大・縮小つき）
  const viewer = document.getElementById("viewer");
  const pages = document.getElementById("pages");
  const STEPS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
  let zi = 2, pdfPages = [], canvases = [], renderToken = 0;

  async function draw() {
    const token = ++renderToken;
    const cssW = pages.clientWidth;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 0; i < pdfPages.length; i++) {
      if (token !== renderToken) return;           // 新しい倍率が来たら中断
      const page = pdfPages[i];
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (cssW / base.width) * ratio });
      const off = document.createElement("canvas");
      off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
      await page.render({ canvasContext: off.getContext("2d"), viewport: vp }).promise;
      if (token !== renderToken) return;
      const c = canvases[i];
      c.width = off.width; c.height = off.height;
      c.getContext("2d").drawImage(off, 0, 0);
    }
  }

  function setZoom(next) {
    next = Math.max(0, Math.min(STEPS.length - 1, next));
    // 画面中央に見えている位置を保ったまま倍率を変える
    const fy = (window.scrollY + innerHeight / 2 - viewer.offsetTop) / Math.max(1, viewer.scrollHeight);
    const fx = (viewer.scrollLeft + viewer.clientWidth / 2) / Math.max(1, viewer.scrollWidth);
    zi = next;
    const z = STEPS[zi];
    pages.style.width = (z * 100) + "%";
    document.getElementById("zreset").textContent = Math.round(z * 100) + "%";
    document.getElementById("zout").disabled = zi === 0;
    document.getElementById("zin").disabled = zi === STEPS.length - 1;
    window.scrollTo(window.scrollX, fy * viewer.scrollHeight + viewer.offsetTop - innerHeight / 2);
    viewer.scrollLeft = fx * viewer.scrollWidth - viewer.clientWidth / 2;
    clearTimeout(setZoom.t);
    setZoom.t = setTimeout(draw, 120);
  }
  document.getElementById("zin").addEventListener("click", () => setZoom(zi + 1));
  document.getElementById("zout").addEventListener("click", () => setZoom(zi - 1));
  document.getElementById("zreset").addEventListener("click", () => setZoom(2));
  let rw = innerWidth;
  window.addEventListener("resize", () => { if (innerWidth !== rw) { rw = innerWidth; clearTimeout(setZoom.t); setZoom.t = setTimeout(draw, 200); } });

  (async () => {
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "assets/pdfjs/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument(PDF).promise;
      pages.innerHTML = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const c = document.createElement("canvas");
        c.width = Math.round(base.width); c.height = Math.round(base.height);
        c.setAttribute("role", "img");
        c.setAttribute("aria-label", "パンフレット " + i + "ページ目");
        pages.appendChild(c);
        pdfPages.push(page); canvases.push(c);
      }
      document.getElementById("zoom").hidden = false;
      await draw();
    } catch (e) {
      pages.hidden = true;
      const f = document.getElementById("fallback");
      f.src = PDF; f.hidden = false;
    }
  })();
})();
</script>
</body>
</html>
